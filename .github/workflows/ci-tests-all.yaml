name: CI

concurrency:
  group: "tests"
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  create-matrix:
    runs-on: ubuntu-latest
    name: create package matrix
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19
      with:
        diagnostic-endpoint: ""
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
    - id: matrix
      run: |
        nix flake show --json --all-systems | jq -cr '.packages."x86_64-linux" | keys' > _temp
        echo $(cat _temp)
        echo "matrix=$(cat _temp)" >> $GITHUB_OUTPUT

  tests-and-build:
    if: github.event.pull_request.draft == false
    needs: [create-matrix]
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.create-matrix.outputs.matrix) }}
    steps:
    - uses: DeterminateSystems/nix-installer-action@90bb610b90bf290cad97484ba341453bd1cbefea # v19
      with:
        diagnostic-endpoint: ""
    - name: Check out code
      uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
    - name: Test ${{ matrix.test }}
      run: nix build -L .#${{ matrix.test }}
