name: CI

concurrency:
  group: "tests"
  cancel-in-progress: false

on:
  push:
    branches:
    - main
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  create-matrix:
    runs-on: ubuntu-latest
    name: create package matrix
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
    - uses: NixOS/nix-installer-action@228d8a956062db04221c97c2794ea443194824aa
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - id: matrix
      run: |
        nix flake show --json --all-systems | jq -cr '.packages."x86_64-linux" | keys' > _temp
        echo $(cat _temp)
        echo "matrix=$(cat _temp)" >> $GITHUB_OUTPUT

  tests-and-build:
    if: github.event.pull_request.draft == false
    needs: [create-matrix]
    name: tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJSON(needs.create-matrix.outputs.matrix) }}
    steps:
    - uses: NixOS/nix-installer-action@228d8a956062db04221c97c2794ea443194824aa
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
    - name: Test ${{ matrix.test }}
      run: nix build -L .#${{ matrix.test }}
